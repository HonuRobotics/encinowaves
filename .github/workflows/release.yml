name: Release
on:
  push:
    tags: [ 'v*' ]
permissions:
  contents: read
jobs:
  build-deb:
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { codename: noble,    image: "ubuntu:24.04", suffix: "~ubuntu24.04" }
          - { codename: resolute, image: "ubuntu:26.04", suffix: "~ubuntu26.04" }
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git cmake build-essential \
            libeigen3-dev libtbb-dev libimath-dev lintian file
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build and package
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr \
                -DBUILD_TESTING=OFF -DEHUKAI_ENABLE_DEB_PACKAGING=ON \
                -DEHUKAI_DEB_DISTRO_SUFFIX="${{ matrix.suffix }}" \
                -DEHUKAI_DEB_DISTRO_CODENAME="${{ matrix.codename }}"
          cmake --build build --target ehukai -j"$(nproc)"
          ( cd build && cpack -G DEB )
      - name: Lintian (soft)
        run: lintian build/*.deb || true
      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.codename }}
          path: build/*.deb
  publish:
    needs: build-deb
    # Skip on forks: HONU_APT_TOKEN is absent there and only this repository
    # should publish releases / notify the APT repository.
    if: github.repository == 'HonuRobotics/ehukai'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # gh release create
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the GitHub Release and attach .debs
        env:
          GH_TOKEN: ${{ github.token }}
        # Idempotent: create the release on the first run, or re-attach the
        # .debs (--clobber overwrites same-named assets) if it already exists,
        # so a re-run or re-pushed tag does not fail on "release already exists".
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.deb --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.deb --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
          fi
      - name: Notify the APT repository
        env:
          HONU_APT_TOKEN: ${{ secrets.HONU_APT_TOKEN }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $HONU_APT_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/HonuRobotics/apt-repository/dispatches \
            -d "{\"event_type\":\"publish-deb\",\"client_payload\":{\"repo\":\"ehukai\",\"tag\":\"$GITHUB_REF_NAME\"}}"
